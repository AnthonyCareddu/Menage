<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ménage</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" id="tc" content="#f4f1ea">
<script>try{var _t=localStorage.getItem('theme');if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{ --p3:#5b7aa8; --p4:#8a6bab; --r:18px;
  --ombre:0 1px 2px rgba(42,39,35,.05), 0 14px 30px -16px rgba(42,39,35,.16); }
:root, :root[data-theme=foyer]{
  --page:#f4f1ea; --card:#fffdf7; --ink:#2a2723; --muted:#8b8177; --line:#e8e2d6;
  --accent:#2d6a4f; --accent-bg:#dcebe2; --late:#bd6b3c; --late-bg:#f6e7db;
  --p1:#2d6a4f; --p2:#b5654d; --hors:#c9c1b3; --err:#b23b31;
}
@media(prefers-color-scheme:dark){ :root:not([data-theme]), :root[data-theme=foyer]{
  --page:#1a1613; --card:#241f1b; --ink:#ece4d9; --muted:#9c9184; --line:#362f28;
  --accent:#63b088; --accent-bg:#25342d; --late:#d98a5a; --late-bg:#38291d;
  --p1:#63b088; --p2:#d98a5a; --hors:#4c453c; --err:#e0776e;
  --ombre:0 1px 2px rgba(0,0,0,.25), 0 14px 32px -16px rgba(0,0,0,.55);
}}

:root[data-theme=foret]{
  --page:#eef0ec; --card:#fbfcfa; --ink:#1f2a22; --muted:#79867c; --line:#dde2dc;
  --accent:#1f5c3d; --accent-bg:#dae8e0; --late:#b0703c; --late-bg:#f0e7db;
  --p1:#1f5c3d; --p2:#a56a4a; --hors:#c4ccc3; --err:#a83b32;
}
@media(prefers-color-scheme:dark){ :root[data-theme=foret]{
  --page:#10140f; --card:#191f17; --ink:#dce8de; --muted:#869484; --line:#262e26;
  --accent:#4e9e6f; --accent-bg:#1e2c21; --late:#cf9d6f; --late-bg:#2e2a1a;
  --p1:#4e9e6f; --p2:#cf9d6f; --hors:#3e463d; --err:#e0776e;
  --ombre:0 1px 2px rgba(0,0,0,.25), 0 14px 32px -16px rgba(0,0,0,.55);
}}

:root[data-theme=argile]{
  --page:#f5efe8; --card:#fffcf6; --ink:#33261f; --muted:#948578; --line:#e8ddd0;
  --accent:#b0553a; --accent-bg:#f0dfd5; --late:#8c6f38; --late-bg:#efe8d5;
  --p1:#b0553a; --p2:#6b7f6a; --hors:#cdbfae; --err:#a33a2e;
}
@media(prefers-color-scheme:dark){ :root[data-theme=argile]{
  --page:#1c1613; --card:#271e19; --ink:#ece0d4; --muted:#a2907f; --line:#392c24;
  --accent:#d3775a; --accent-bg:#38271f; --late:#cbaa6a; --late-bg:#332a1a;
  --p1:#d3775a; --p2:#8faa8a; --hors:#4f4238; --err:#e0776e;
  --ombre:0 1px 2px rgba(0,0,0,.25), 0 14px 32px -16px rgba(0,0,0,.55);
}}

:root[data-theme=marine]{
  --page:#eef1f5; --card:#ffffff; --ink:#1c2634; --muted:#74808f; --line:#dbe1e9;
  --accent:#2e4a7a; --accent-bg:#dde5f0; --late:#b5793f; --late-bg:#f3e8d9;
  --p1:#2e4a7a; --p2:#b5793f; --hors:#c0c8d2; --err:#b03e34;
}
@media(prefers-color-scheme:dark){ :root[data-theme=marine]{
  --page:#12151b; --card:#1b202a; --ink:#e3e8f0; --muted:#8894a4; --line:#2a313d;
  --accent:#7f9fd4; --accent-bg:#212a3c; --late:#d69f6a; --late-bg:#33291d;
  --p1:#7f9fd4; --p2:#d69f6a; --hors:#434c58; --err:#e0776e;
  --ombre:0 1px 2px rgba(0,0,0,.25), 0 14px 32px -16px rgba(0,0,0,.55);
}}

:root[data-theme=prune]{
  --page:#f2eef1; --card:#fdfbfc; --ink:#2e2530; --muted:#8a7f8a; --line:#e5dde3;
  --accent:#7a4a72; --accent-bg:#ebe0ea; --late:#a56b45; --late-bg:#f0e6db;
  --p1:#7a4a72; --p2:#6b8f7d; --hors:#cbc0c9; --err:#a83b3b;
}
@media(prefers-color-scheme:dark){ :root[data-theme=prune]{
  --page:#191519; --card:#241e23; --ink:#ebe2ea; --muted:#9c8f9c; --line:#352d34;
  --accent:#b98cae; --accent-bg:#322632; --late:#cf9d76; --late-bg:#33291d;
  --p1:#b98cae; --p2:#86b09b; --hors:#4c434b; --err:#e0776e;
  --ombre:0 1px 2px rgba(0,0,0,.25), 0 14px 32px -16px rgba(0,0,0,.55);
}}

:root[data-theme=nuit]{
  --page:#101216; --card:#1a1e25; --ink:#e8ebf0; --muted:#8891a0; --line:#262b34;
  --accent:#7aa2f7; --accent-bg:#212a3d; --late:#e0a45c; --late-bg:#33291c;
  --p1:#7aa2f7; --p2:#e0a45c; --hors:#3c434f; --err:#e0776e;
  --ombre:0 1px 2px rgba(0,0,0,.25), 0 14px 34px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
#bandeau,#maj,header,main{max-width:480px;margin-inline:auto}

header{padding:calc(12px + env(safe-area-inset-top)) 20px 16px;background:var(--page);
  position:sticky;top:0;z-index:5}
.tete-h{display:flex;align-items:center;justify-content:space-between;min-height:32px}
.jour{font-size:13px;color:var(--muted);letter-spacing:.01em}
.ico-btn{width:40px;height:40px;margin:-8px -9px -8px 0;border:0;background:none;color:var(--muted);
  display:flex;align-items:center;justify-content:center;border-radius:11px}
.ico-btn:active{background:var(--accent-bg);color:var(--accent)}
.ico-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.compte{display:flex;align-items:baseline;gap:9px;margin-top:7px}
.gros{font-size:39px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.gros-sub{font-size:14px;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--line);margin-top:15px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:3px;
  transition:width .5s cubic-bezier(.4,0,.2,1)}
.prog.plein span{box-shadow:0 0 10px -1px var(--accent)}

main{padding:0 16px 112px}
.groupe{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;
  padding:22px 6px 9px;text-transform:uppercase}
.liste{background:var(--card);border-radius:var(--r);box-shadow:var(--ombre);overflow:hidden}
.liste + .liste{margin-top:14px}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer;transition:background .15s}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--accent-bg)}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:1.6px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s,transform .2s}
.box svg{width:14px;height:14px;stroke:#fff;stroke-width:2.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.row.ok .box{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.row.ok .box svg{opacity:1}
.txt{flex:1;min-width:0}
.nom{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row.ok .nom{text-decoration:line-through;color:var(--muted);font-weight:400}
.meta{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.tag,.pers{flex:none;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:11px;white-space:nowrap}
.tag{background:var(--late-bg);color:var(--late)}
.pers{background:color-mix(in srgb,currentColor 15%,transparent)}

.vide{padding:54px 24px;text-align:center;color:var(--muted)}
.vide svg{width:38px;height:38px;stroke:var(--hors);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 14px}

.seg{display:flex;gap:4px;background:var(--card);border-radius:13px;padding:4px;
  box-shadow:var(--ombre);margin:16px 0 2px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:9px;
  font-size:13.5px;font-weight:600;transition:background .15s,color .15s}
.seg button.on{background:var(--accent-bg);color:var(--accent)}
.jt{font-size:13px;font-weight:700;padding:20px 6px 8px}
.jt span{font-weight:400;color:var(--muted)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:var(--card);
  border-radius:var(--r);box-shadow:var(--ombre);padding:14px 12px;margin-top:16px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 6px;font-weight:600}
.cell{aspect-ratio:1;background:var(--page);border-radius:10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;
  cursor:pointer;transition:transform .1s}
.cell:active{transform:scale(.92)}
.cell.hors{background:transparent;color:var(--hors);pointer-events:none}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.cell.fini{background:var(--accent);color:#fff;font-weight:600}
.cell.partiel{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
.cell.rate{color:var(--hors)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell .charge{display:block;height:3px;border-radius:2px;background:var(--accent);
  width:calc(var(--n,1) * 16%);opacity:.75}

.pilule{border:1px solid var(--line);background:none;color:var(--muted);
  border-radius:14px;padding:6px 14px;font-size:13px;font-weight:600}
.pilule.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.barre{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0 16px;background:var(--line)}
.barre span{display:block}
.puce{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{border:0;background:none;padding:9px 0 9px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}

.bloc{background:var(--card);border-radius:var(--r);box-shadow:var(--ombre);padding:18px;margin-top:16px}
.bloc:first-child{margin-top:18px}
.champ{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0}
.champ input[type=text],.champ input[type=number],.champ input[type=date],.champ select{
  border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--page);max-width:56%}
.champ input.large{max-width:100%;width:100%}
.row.off{opacity:.5}
h2{font-size:14px;font-weight:700;margin:0 0 4px}
.aide{font-size:12.5px;color:var(--muted);margin:2px 0 12px;line-height:1.45}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;
  border-radius:12px;padding:12px 16px;width:100%;margin-top:12px;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn.sec{background:none;color:var(--accent)}
.btn.danger{background:none;border-color:color-mix(in srgb,var(--err) 45%,transparent);color:var(--err)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.theme-chip{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line);
  border-radius:12px;background:none;color:var(--ink);font-weight:600;font-size:13.5px}
.theme-chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.theme-apercu{width:32px;height:32px;border-radius:9px;flex:none;border:1px solid rgba(0,0,0,.08);
  background:linear-gradient(135deg,var(--sw-p) 0 52%,var(--sw-a) 52% 100%)}
.theme-apercu[data-t=foyer]{--sw-p:#f4f1ea;--sw-a:#2d6a4f}
.theme-apercu[data-t=foret]{--sw-p:#eef0ec;--sw-a:#1f5c3d}
.theme-apercu[data-t=argile]{--sw-p:#f5efe8;--sw-a:#b0553a}
.theme-apercu[data-t=marine]{--sw-p:#eef1f5;--sw-a:#2e4a7a}
.theme-apercu[data-t=prune]{--sw-p:#f2eef1;--sw-a:#7a4a72}
.theme-apercu[data-t=nuit]{--sw-p:#101216;--sw-a:#7aa2f7}
.sw{position:relative;width:44px;height:26px;border-radius:13px;background:var(--line);
  flex:none;transition:background .2s}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .2s}
.sw.on i{transform:translateX(18px)}
.bandeau{background:var(--late-bg);color:var(--late);font-size:13px;font-weight:500;
  padding:10px 20px;text-align:center}
#maj{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(74px + env(safe-area-inset-bottom));z-index:20;
  background:var(--ink);color:var(--page);font-size:13.5px;font-weight:500;
  padding:11px 16px;border-radius:13px;display:flex;align-items:center;gap:16px;
  max-width:calc(100% - 32px);box-shadow:var(--ombre);animation:toast .2s ease}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#toast button{background:none;border:0;color:var(--page);font-weight:700;font-size:13.5px;
  flex:none;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--err);font-size:13px;padding:4px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="bandeau" class="bandeau" hidden></div>
<div id="maj" class="bandeau" hidden style="cursor:pointer"></div>
<div id="toast" hidden></div>
<header>
  <div class="tete-h">
    <div class="jour" id="dateLabel"></div>
    <button class="ico-btn" id="actBtn" aria-label="Réglages"></button>
  </div>
  <div class="compte"><span class="gros" id="gros">—</span><span class="gros-sub" id="grosSub"></span></div>
  <div class="prog" id="prog" hidden><span></span></div>
</header>

<main id="vue"></main>

<nav>
  <button data-v="jour">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4 5.6 5.6"/></svg>
    <span>Aujourd'hui</span>
  </button>
  <button data-v="planning">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
    <span>Planning</span>
  </button>
  <button data-v="bilan">
    <svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6.5 20v-6M12 20V8.5M17.5 20v-9"/></svg>
    <span>Bilan</span>
  </button>
</nav>

<script>
const JOURS = ['dim','lun','mar','mer','jeu','ven','sam'];
const JOURS_L = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

const S = {
  api: localStorage.getItem('api') || '',
  moi: localStorage.getItem('moi') || '',
  data: JSON.parse(localStorage.getItem('cache') || 'null'),
  vue: 'jour',
  ancre: new Date(),
  tacheEdit: null,
  bilanPeriode: 7,
  planningVue: 'semaine',
  moisJour: null,
  theme: localStorage.getItem('theme') || 'foyer'
};

const THEMES = [['foyer','Foyer'], ['foret','Forêt'], ['argile','Argile'],
                ['marine','Marine'], ['prune','Prune'], ['nuit','Nuit']];

function majBarreEtat(){
  const pg = getComputedStyle(document.documentElement).getPropertyValue('--page').trim();
  if(pg) document.getElementById('tc').setAttribute('content', pg);
}

function appliquerTheme(nom){
  S.theme = nom || 'foyer';
  document.documentElement.dataset.theme = S.theme;
  localStorage.setItem('theme', S.theme);
  majBarreEtat();
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', majBarreEtat);

const ICO = {
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4 5.6 5.6"/></svg>',
  check: '<svg viewBox="0 0 24 24" style="stroke:var(--accent)"><path d="M4.5 12.5l5 5 10-11"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.3"/><path d="M19.5 12a7.5 7.5 0 0 0-.15-1.5l2-1.55-2-3.46-2.36 1a7.5 7.5 0 0 0-2.6-1.5L14 1h-4l-.39 2.49a7.5 7.5 0 0 0-2.6 1.5l-2.36-1-2 3.46 2 1.55A7.5 7.5 0 0 0 4.5 12c0 .51.05 1.01.15 1.5l-2 1.55 2 3.46 2.36-1a7.5 7.5 0 0 0 2.6 1.5L10 23h4l.39-2.49a7.5 7.5 0 0 0 2.6-1.5l2.36 1 2-3.46-2-1.55c.1-.49.15-.99.15-1.5z"/></svg>',
  retour: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>'
};

const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseYmd = s => { const p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const plus = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

async function api(params){
  if(!S.api) throw new Error('Adresse du serveur non renseignée');
  const u = new URL(S.api);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k,v));
  let r;
  try{ r = await fetch(u.toString()); }
  catch(e){ const err = new Error('réseau indisponible'); err.reseau = true; throw err; }
  const j = await r.json();
  if(!j.ok) throw new Error(j.erreur || 'erreur serveur');
  return j.data;
}

async function charger(){
  try{
    S.data = await api({action:'data'});
    localStorage.setItem('cache', JSON.stringify(S.data));
    S.horsLigne = false;
    viderFile();
  }catch(e){
    S.horsLigne = true;
  }
  statut();
  rendre();
}

/* ------------------------------------------- file d'attente hors-ligne */

S.queue = JSON.parse(localStorage.getItem('queue') || '[]');
S.horsLigne = false;

function sauverFile(){ localStorage.setItem('queue', JSON.stringify(S.queue)); }

async function envoyer(params){
  try{
    await api(params);
    S.horsLigne = false;
    await viderFile();
    return true;
  }catch(e){
    if(e.reseau){
      S.queue.push({ params, ts: Date.now() });
      sauverFile();
      statut();
    }else{
      bandeau('Refusé par le serveur : ' + e.message);
    }
    return false;
  }
}

async function viderFile(){
  while(S.queue.length){
    try{
      await api(S.queue[0].params);
    }catch(e){
      if(e.reseau){ statut(); return; }
      S.queue.shift(); sauverFile();   // erreur serveur : on abandonne l'item pour ne pas bloquer
      continue;
    }
    S.queue.shift(); sauverFile();
  }
  statut();
}

function statut(){
  const n = S.queue.length;
  if(n) bandeau(n + (n > 1 ? ' modifs' : ' modif') + ' en attente — synchro au retour du réseau');
  else if(S.horsLigne) bandeau(S.data ? 'Hors ligne — dernières données connues' : 'Impossible de joindre le serveur');
  else bandeau(null);
}

addEventListener('online', viderFile);
addEventListener('visibilitychange', () => { if(!document.hidden) viderFile(); });

function bandeau(msg){
  const b = document.getElementById('bandeau');
  b.hidden = !msg; b.textContent = msg || '';
}

let _toastT;
function toast(msg, action){
  const el = document.getElementById('toast');
  clearTimeout(_toastT);
  el.innerHTML = '';
  const s = document.createElement('span');
  s.textContent = msg;
  s.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  el.appendChild(s);
  if(action){
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { clearTimeout(_toastT); el.hidden = true; action.fn(); };
    el.appendChild(b);
  }
  el.hidden = false;
  _toastT = setTimeout(() => { el.hidden = true; }, 4500);
}

/* ---------------------------------------------- moteur de récurrence */

function derniereFois(id){
  let d = null;
  (S.data.journal||[]).forEach(r => { if(r.id===id && (!d || r.date>d)) d = r.date; });
  return d;
}

function estDue(t, dateStr){
  const d = parseYmd(dateStr);
  if(t.mode === 'quotidien') return true;
  if(t.mode === 'jours')
    return String(t.regle).split(',').map(s=>s.trim()).includes(JOURS[d.getDay()]);
  if(t.mode === 'mois'){
    const dernier = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    return d.getDate() === Math.min(parseInt(t.regle,10), dernier);
  }
  if(t.mode === 'intervalle'){
    // projetée uniquement à sa date prévue (dernière fois + N jours)
    const last = derniereFois(t.id);
    if(!last) return false;
    const n = parseInt(t.regle,10) || 1;
    return dateStr === ymd(plus(parseYmd(last), n));
  }
  if(t.mode === 'date')
    return dateStr === String(t.regle);
  return false;
}

/* tâches "en attente" un jour donné : intervalle en retard / jamais faite,
   one-off en retard. Ajoutées à la vue du jour uniquement. */
function enAttente(t, dateStr){
  if(t.mode === 'date')
    return String(t.regle) < dateStr && !derniereFois(t.id);
  if(t.mode === 'intervalle'){
    const last = derniereFois(t.id);
    if(!last) return true;
    const n = parseInt(t.regle,10) || 1;
    return Math.round((parseYmd(dateStr) - parseYmd(last)) / 86400000) >= n;
  }
  return false;
}

function retard(t, dateStr){
  if(t.mode === 'date'){
    if(derniereFois(t.id)) return 0;
    return Math.max(0, Math.round((parseYmd(dateStr) - parseYmd(String(t.regle)))/86400000));
  }
  if(t.mode !== 'intervalle') return 0;
  const n = parseInt(t.regle,10) || 1;
  const last = derniereFois(t.id);
  if(!last) return 0;
  return Math.max(0, Math.round((parseYmd(dateStr) - parseYmd(last))/86400000) - n);
}

const faite = (id, dateStr) => (S.data.journal||[]).some(r => r.id===id && r.date===dateStr);

function masquee(id, dateStr){
  const s = JSON.parse(localStorage.getItem('snooze') || '{}');
  return s[id] && s[id] >= dateStr;
}

function estActif(t){
  if(t.actif === false) return false;
  const s = String(t.actif).toLowerCase();
  return s !== 'false' && s !== 'faux' && s !== 'non';
}

function recurrenceLisible(t){
  if(t.mode === 'quotidien') return 'tous les jours';
  if(t.mode === 'jours') return String(t.regle);
  if(t.mode === 'mois') return 'le ' + t.regle + ' du mois';
  if(t.mode === 'intervalle') return 'tous les ' + t.regle + ' j';
  if(t.mode === 'date') return 'le ' + t.regle;
  return '';
}

function personnes(){
  const c = (S.data && S.data.config) || {};
  return (c.personnes || 'Antho,Alexandra').split(',').map(s=>s.trim()).filter(Boolean);
}

function couleurPersonne(nom){
  const i = personnes().indexOf(nom);
  return 'var(--p' + (i >= 0 && i < 4 ? i + 1 : 1) + ')';
}

function pourLeJour(dateStr){
  if(!S.data) return [];
  const auj = dateStr === ymd(new Date());
  return S.data.taches
    .filter(estActif)
    .filter(t => !(auj && masquee(t.id, dateStr)))
    .filter(t => estDue(t, dateStr) || (auj && enAttente(t, dateStr)))
    .map(t => ({...t, retard: retard(t,dateStr), faite: faite(t.id,dateStr)}))
    .sort((a,b) => (b.retard-a.retard) || (a.faite-b.faite) || a.nom.localeCompare(b.nom));
}

/* ------------------------------------------------------------- rendu */

function aller(vue){ S.vue = vue; S.ancre = new Date(); S.tacheEdit = null; S.moisJour = null; rendre(); }

function rendre(){
  const v = document.getElementById('vue');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === S.vue));

  const act = document.getElementById('actBtn');
  if(S.vue === 'reglages'){
    act.innerHTML = ICO.retour; act.onclick = () => aller('jour');
  }else if(S.vue === 'taches'){
    act.innerHTML = ICO.retour;
    act.onclick = () => { if(S.tacheEdit){ S.tacheEdit = null; rendre(); } else aller('reglages'); };
  }else{
    act.innerHTML = ICO.gear; act.onclick = () => aller('reglages');
  }

  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)
    v.animate([{opacity:0, transform:'translateY(6px)'}, {opacity:1, transform:'none'}],
      {duration:250, easing:'cubic-bezier(.4,0,.2,1)'});

  if(!S.data && S.vue !== 'reglages'){
    enTete('', 'Bienvenue', '');
    v.innerHTML = '<div class="vide">' + ICO.sun +
      '<div>Renseigne l\'adresse du serveur dans les réglages (roue crantée) pour démarrer.</div></div>';
    return;
  }
  ({jour:vJour, planning:vPlanning, bilan:vBilan, reglages:vReglages, taches:vTaches})[S.vue](v);
}

function enTete(label, gros, sub){
  document.getElementById('dateLabel').textContent = label;
  document.getElementById('gros').textContent = gros;
  document.getElementById('grosSub').textContent = sub || '';
  progres(0, 0);
}

function progres(fait, total){
  const p = document.getElementById('prog');
  if(!total){ p.hidden = true; return; }
  p.hidden = false;
  p.firstElementChild.style.width = Math.round(fait / total * 100) + '%';
}

function ligne(t, dateStr){
  const el = document.createElement('div');
  el.className = 'row' + (t.faite ? ' ok' : '');
  el.innerHTML =
    '<span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>' +
    '<span class="txt"><span class="nom"></span><span class="meta"></span></span>' +
    (t.retard>0 ? '<span class="tag">+'+t.retard+' j</span>' : '') +
    (t.qui ? '<span class="pers"></span>' : '');
  el.querySelector('.nom').textContent = t.nom;
  const bouts = [t.zone, t.duree+' min'];
  if(t.mode === 'intervalle'){
    const last = derniereFois(t.id);
    if(last) bouts.push('il y a ' + Math.round((parseYmd(dateStr) - parseYmd(last))/86400000) + ' j');
  }
  el.querySelector('.meta').textContent = bouts.filter(Boolean).join(' · ');
  if(t.qui){
    const p = el.querySelector('.pers');
    p.textContent = t.qui;
    p.style.color = couleurPersonne(t.qui);
  }
  el.onclick = () => cocher(t, dateStr, el);
  return el;
}

function liste(taches, dateStr){
  const box = document.createElement('div');
  box.className = 'liste';
  taches.forEach(t => box.appendChild(ligne(t, dateStr)));
  return box;
}

function cocher(t, dateStr, el){
  const on = !el.classList.contains('ok');
  el.classList.toggle('ok', on);
  if(on && navigator.vibrate) navigator.vibrate(15);
  const qui = t.qui || S.moi || '';
  if(on){
    S.data.journal.push({id:t.id, date:dateStr, qui, retard:0});
    toast('« ' + t.nom + ' » fait', { label:'Annuler', fn:() => decocher(t, dateStr) });
  }else{
    S.data.journal = S.data.journal.filter(r => !(r.id===t.id && r.date===dateStr));
  }
  localStorage.setItem('cache', JSON.stringify(S.data));
  if(S.vue==='jour') majCompteur();
  envoyer({action:'toggle', id:t.id, date:dateStr, qui});
}

function decocher(t, dateStr){
  S.data.journal = S.data.journal.filter(r => !(r.id===t.id && r.date===dateStr));
  localStorage.setItem('cache', JSON.stringify(S.data));
  envoyer({action:'toggle', id:t.id, date:dateStr, qui: t.qui || S.moi || ''});
  rendre();
}

function bilanDuJour(){
  const d = ymd(new Date());
  const l = pourLeJour(d);
  const reste = l.filter(t => !t.faite);
  const actifs = new Set(S.data.taches.filter(estActif).map(t => String(t.id)));
  const faites = new Set((S.data.journal||[])
    .filter(r => r.date === d && actifs.has(String(r.id))).map(r => String(r.id)));
  reste.forEach(t => faites.delete(String(t.id)));
  return { reste, nbFait: faites.size, total: reste.length + faites.size };
}

function majCompteur(){
  const b = bilanDuJour();
  const min = b.reste.reduce((s,t)=>s+(Number(t.duree)||0),0);
  const dd = new Date();
  enTete(cap(JOURS_L[dd.getDay()]) + ' ' + dd.getDate() + ' ' + MOIS_L[dd.getMonth()],
    b.reste.length ? min + ' min' : (b.total ? 'Terminé' : 'Rien à faire'),
    b.reste.length ? b.reste.length + (b.reste.length>1?' tâches restantes':' tâche restante')
      : (b.total ? b.nbFait + (b.nbFait>1?' tâches faites':' tâche faite') : ''));
  if(b.total) progres(b.nbFait, b.total);
  document.getElementById('prog').classList.toggle('plein', b.total > 0 && b.reste.length === 0);
}

function vJour(v){
  const d = ymd(new Date());
  majCompteur();
  const b = bilanDuJour();
  const l = pourLeJour(d);
  v.innerHTML = '';
  if(!l.length){
    v.innerHTML = '<div class="vide">' + (b.nbFait ? ICO.check : ICO.sun) + '<div>' +
      (b.nbFait ? 'Tout est fait pour aujourd\'hui.' : 'Journée tranquille — rien de prévu.') +
      '</div></div>';
    return;
  }
  const tard = l.filter(t=>t.retard>0), reste = l.filter(t=>t.retard===0);
  if(tard.length){ v.appendChild(titre('En retard')); v.appendChild(liste(tard, d)); }
  if(reste.length){
    if(tard.length) v.appendChild(titre('Aujourd\'hui'));
    v.appendChild(liste(reste, d));
  }
}

function vSemaine(v){
  const base = new Date();
  const lundi = plus(base, -((base.getDay()+6)%7));
  let total = 0;
  v.innerHTML = '';
  for(let i=0;i<7;i++){
    const d = plus(lundi,i), ds = ymd(d), l = pourLeJour(ds);
    total += l.filter(t=>!t.faite).reduce((s,t)=>s+(Number(t.duree)||0),0);
    const h = document.createElement('div');
    h.className = 'jt';
    h.innerHTML = esc(cap(JOURS_L[d.getDay()]) + ' ' + d.getDate()) +

    if(l.length) v.appendChild(liste(l, ds));
  }
  enTete('Semaine du ' + lundi.getDate() + ' ' + MOIS_L[lundi.getMonth()],

function vMois(v){
  const a = S.ancre, an = a.getFullYear(), mo = a.getMonth();
  const premier = new Date(an, mo, 1);
  const debut = plus(premier, -((premier.getDay()+6)%7));
  const today = ymd(new Date());
  let html = '<div class="cal">' + ['lun','mar','mer','jeu','ven','sam','dim'].map(j=>'<div class="dow">'+j+'</div>').join('');
  for(let i=0;i<42;i++){
    const d = plus(debut,i), ds = ymd(d), hors = d.getMonth() !== mo;
    let cls = 'cell', extra = '';
    if(hors) cls += ' hors';
    if(ds === today) cls += ' today';
    if(ds === S.moisJour) cls += ' sel';
    if(!hors){
      const l = pourLeJour(ds);
      if(ds < today){
        // statut basé sur les tâches datées (jours/mois/date) ; l'intervalle est un rythme, pas un jour
        const jour = l.filter(t => t.mode !== 'intervalle');
        if(jour.length){
          const f = jour.filter(t=>t.faite).length;
          cls += f === jour.length ? ' fini' : (f ? ' partiel' : ' rate');
        }
      }else if(l.length){
        extra = '<span class="charge" style="--n:' + Math.min(l.length,5) + '"></span>';
      }
    }
    html += '<div class="' + cls + '" data-d="' + ds + '">' + d.getDate() + extra + '</div>';
  }
  html += '</div><div style="display:flex;gap:10px;margin-top:14px">' +
    '<button class="btn sec" id="prev" style="margin:0">‹ ' + cap(MOIS_L[(mo+11)%12]) + '</button>' +
    '<button class="btn sec" id="next" style="margin:0">' + cap(MOIS_L[(mo+1)%12]) + ' ›</button></div>';
  v.innerHTML = html;

  v.querySelectorAll('.cell[data-d]').forEach(c => c.onclick = () => {
    S.moisJour = (S.moisJour === c.dataset.d) ? null : c.dataset.d;
    rendre();
  });
  v.querySelector('#prev').onclick = () => { S.ancre = new Date(an, mo-1, 1); S.moisJour = null; rendre(); };
  v.querySelector('#next').onclick = () => { S.ancre = new Date(an, mo+1, 1); S.moisJour = null; rendre(); };

  if(S.moisJour){
    const jd = parseYmd(S.moisJour);
    const l = pourLeJour(S.moisJour);
    v.appendChild(titre(cap(JOURS_L[jd.getDay()]) + ' ' + jd.getDate() + ' ' + MOIS_L[jd.getMonth()]));
    v.appendChild(l.length ? liste(l, S.moisJour)
      : Object.assign(document.createElement('p'), { className:'aide', textContent:'Rien ce jour-là.' }));
  }else{
    v.insertAdjacentHTML('beforeend',
      '<p class="aide" style="margin-top:12px">Touche un jour pour voir ses tâches. ' +
      'Vert plein = journée bouclée. Les tâches à intervalle sont projetées à titre indicatif.</p>');
  }
  enTete('Planning', cap(MOIS_L[mo]) + ' ' + an, '');
}

/* ---------------------------------------------------------- bilan */

function statsPeriode(jours){
  const fin = new Date(); fin.setHours(23,59,59,999);
  const debut = plus(new Date(), -(jours-1)); debut.setHours(0,0,0,0);
  const actives = S.data.taches.filter(estActif);
  const dureeParId = {};
  S.data.taches.forEach(t => dureeParId[t.id] = Number(t.duree) || 0);

  const faits = (S.data.journal||[]).filter(r => {
    const d = parseYmd(r.date);
    return d >= debut && d <= fin;
  });

  const parPersonne = {};
  let aLheure = 0;
  faits.forEach(r => {
    const q = r.qui || 'non attribué';
    parPersonne[q] = parPersonne[q] || {n:0, min:0};
    parPersonne[q].n++;
    parPersonne[q].min += dureeParId[r.id] || 0;
    if((Number(r.retard)||0) <= 0) aLheure++;
  });

  let attendu = 0;
  actives.forEach(t => {
    if(t.mode === 'quotidien') attendu += jours;
    else if(t.mode === 'jours') attendu += String(t.regle).split(',').length * (jours/7);
    else if(t.mode === 'mois') attendu += jours/30;
    else if(t.mode === 'intervalle') attendu += jours / (parseInt(t.regle,10) || 1);
    else if(t.mode === 'date'){
      const jd = parseYmd(String(t.regle));
      if(jd >= debut && jd <= fin) attendu += 1;
    }
  });
  attendu = Math.max(1, Math.round(attendu));

  const vues = {};
  faits.forEach(r => vues[r.id] = 1);
  return {
    faits, parPersonne, attendu,
    oubliees: actives.filter(t => !vues[t.id]),
    ponctualite: faits.length ? Math.round(aLheure/faits.length*100) : 0,
    accomplissement: Math.min(100, Math.round(faits.length/attendu*100))
  };
}

function vBilan(v){
  const jours = S.bilanPeriode;
  const st = statsPeriode(jours);
  enTete('', 'Bilan', jours + ' derniers jours');

  personnes().forEach(g => { if(!st.parPersonne[g]) st.parPersonne[g] = {n:0, min:0}; });
  const noms = Object.keys(st.parPersonne)
    .sort((a,b) => st.parPersonne[b].min - st.parPersonne[a].min || st.parPersonne[b].n - st.parPersonne[a].n);
  const coul = q => q === 'non attribué' ? 'var(--muted)' : couleurPersonne(q);
  const totalMin = noms.reduce((s,q) => s + st.parPersonne[q].min, 0);
  const totalN = noms.reduce((s,q) => s + st.parPersonne[q].n, 0);
  const base = totalMin > 0 ? 'min' : 'n';
  const total = base === 'min' ? totalMin : totalN;

  const segments = total
    ? noms.map(q => `<span style="width:${st.parPersonne[q][base]/total*100}%;background:${coul(q)}"></span>`).join('')
    : '';

  v.innerHTML = `
  <div class="bloc">
    <div class="champ" style="justify-content:flex-start;gap:8px;padding:0 0 4px">
      <button class="pilule${jours===7?' on':''}" data-j="7">7 jours</button>
      <button class="pilule${jours===30?' on':''}" data-j="30">30 jours</button>
    </div>
    <h2>Répartition</h2>
    <p class="aide">Part de chacun${base==='min'?', en temps passé':', en nombre de tâches'}.</p>
    <div class="barre">${segments}</div>
    ${noms.map(q => `<div class="champ" style="padding:6px 0">
      <span><span class="puce" style="background:${coul(q)}"></span>${esc(q)}</span>
      <span class="aide" style="margin:0">${st.parPersonne[q].n} tâches · ${st.parPersonne[q].min} min${total?' · '+Math.round(st.parPersonne[q][base]/total*100)+'%':''}</span>
    </div>`).join('')}
    ${totalN ? '' : '<p class="aide">Rien de coché sur la période.</p>'}
  </div>
  <div class="bloc">
    <h2>Sur la période</h2>
    <div class="champ" style="padding:6px 0"><span>Tâches faites</span><span>${st.faits.length} <span class="aide" style="margin:0">/ ~${st.attendu} prévues</span></span></div>
    <div class="champ" style="padding:6px 0"><span>Accomplissement</span><span>${st.accomplissement} %</span></div>
    <div class="champ" style="padding:6px 0"><span>Dans les temps</span><span>${st.ponctualite} %</span></div>
  </div>
  <div class="bloc">
    <h2>Jamais faites sur la période</h2>
    ${st.oubliees.length
      ? st.oubliees.map(t => `<div class="champ" style="padding:6px 0"><span>${esc(t.nom)}</span><span class="aide" style="margin:0">${esc(recurrenceLisible(t))}</span></div>`).join('')
      : '<p class="aide">Rien — tout est passé au moins une fois.</p>'}
  </div>`;

  v.querySelectorAll('.pilule').forEach(b => b.onclick = () => { S.bilanPeriode = +b.dataset.j; rendre(); });
}

    <div id="n_etat" class="aide" style="margin-bottom:10px">Vérification…</div>
    <div id="n_actions"></div>
    <div class="champ"><span>Heure du matin</span><input type="number" id="h_matin" min="0" max="23" style="max-width:70px"></div>
    <div class="champ"><span>Heure du soir</span><input type="number" id="h_soir" min="0" max="23" style="max-width:70px"></div>
    <p class="aide">Sur iPhone : « Ajouter à l'écran d'accueil » d'abord, puis ouvrir depuis l'icône (iOS 16.4+).</p>
  </div>
  <div class="bloc">
    <h2>E-mails automatiques</h2>
    ${sw('mail_quotidien','Récap du matin',c)}
    ${sw('mail_soir','Récap du soir',c)}
    ${sw('mail_hebdo','Récap hebdomadaire',c)}
    ${sw('mail_mensuel','Récap mensuel',c)}
    ${sw('vacances','Mode vacances',c)}
    <p class="aide">Le mode vacances suspend tous les envois (mails et notifications) sans rien effacer.</p>
  </div>`;

  const api_ = v.querySelector('#api'); api_.value = S.api;
  v.querySelector('#saveApi').onclick = () => {
    S.api = api_.value.trim(); localStorage.setItem('api', S.api); majConf(); charger();
  };
  v.querySelector('#moi').onchange = e => {
    S.moi = e.target.value; localStorage.setItem('moi', S.moi); majConf();
  };
  v.querySelectorAll('.theme-chip').forEach(b => b.onclick = () => {
    appliquerTheme(b.dataset.t);
    vReglages(document.getElementById('vue'));
  });
  v.querySelector('#gererTaches').onclick = () => { S.tacheEdit = null; S.vue = 'taches'; rendre(); };
  v.querySelectorAll('.sw[data-k]').forEach(el => el.onclick = () => {
    const on = !el.classList.contains('on');
    el.classList.toggle('on', on);
    if(S.data) S.data.config[el.dataset.k] = on ? 'oui' : 'non';
    localStorage.setItem('cache', JSON.stringify(S.data));
    envoyer({action:'setConfig', cle:el.dataset.k, valeur:on?'oui':'non'});
  });

  const hm = v.querySelector('#h_matin'), hs = v.querySelector('#h_soir');
  hm.value = c.heure_matin || '7';
  hs.value = c.heure_soir || '19';
  const majHeure = (cle, el) => {
    const n = parseInt(el.value, 10);
    if(isNaN(n) || n < 0 || n > 23){ el.value = (S.data.config && S.data.config[cle]) || ''; return; }
    if(S.data) S.data.config[cle] = String(n);
    localStorage.setItem('cache', JSON.stringify(S.data));
    envoyer({action:'setConfig', cle, valeur:String(n)});
  };
  hm.onchange = () => majHeure('heure_matin', hm);
  hs.onchange = () => majHeure('heure_soir', hs);

  majEtatNotifs(v);
}

/* --------------------------------------------------- notifications push */

function notifsSupportees(){
  return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
}

function b64urlToU8(s){
  const b = atob(s.replace(/-/g,'+').replace(/_/g,'/'));
  const u = new Uint8Array(b.length);
  for(let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}

async function majConf(){
  if(!('caches' in window)) return;
  try{
    const c = await caches.open('conf');
    await c.put('api', new Response(S.api || ''));
    await c.put('moi', new Response(S.moi || ''));
  }catch(e){}
}

async function majEtatNotifs(v){
  const etat = v.querySelector('#n_etat'), actions = v.querySelector('#n_actions');
  if(!etat) return;
  const dire = m => etat.textContent = m;
  if(!notifsSupportees()){ dire('Non disponible sur ce navigateur.'); return; }
  if(Notification.permission === 'denied'){
    dire('Notifications bloquées. Autorisez-les dans les réglages du navigateur pour cet appareil.'); return;
  }
  const reg = await navigator.serviceWorker.ready.catch(() => null);
  const sub = reg ? await reg.pushManager.getSubscription() : null;
  dire(sub ? 'Activées sur cet appareil.' : 'Pas encore activées sur cet appareil.');
  if(sub){
    const pm = localStorage.getItem('notif_matin') !== 'non';
    const ps = localStorage.getItem('notif_soir') !== 'non';
    actions.innerHTML =
      `<div class="champ"><span>Rappel du matin</span><span class="sw${pm?' on':''}" data-p="matin"><i></i></span></div>` +
      `<div class="champ"><span>Rappel du soir</span><span class="sw${ps?' on':''}" data-p="soir"><i></i></span></div>` +
      '<button class="btn sec" id="n_test">Envoyer un test</button>' +
      '<button class="btn danger" id="n_off">Désactiver sur cet appareil</button>';
    actions.querySelectorAll('.sw[data-p]').forEach(el => el.onclick = () => {
      const on = !el.classList.contains('on');
      el.classList.toggle('on', on);
      localStorage.setItem('notif_' + el.dataset.p, on ? 'oui' : 'non');
      pousserPrefsNotifs(sub);
    });
    actions.querySelector('#n_test').onclick = async () => {
      dire('Envoi du test…');
      try{ await api({action:'testPush'}); dire('Test envoyé — la notification arrive dans quelques secondes.'); }
      catch(e){ dire('Échec du test : ' + e.message); }
    };
    actions.querySelector('#n_off').onclick = async () => {
      try{
        await sub.unsubscribe();
        await envoyer({action:'unsubscribePush', endpoint: sub.endpoint});
      }catch(e){}
      localStorage.removeItem('notifs');
      vReglages(document.getElementById('vue'));
    };
  }else{
    actions.innerHTML = '<button class="btn" id="n_on" style="margin-top:0">Activer les notifications</button>';
    actions.querySelector('#n_on').onclick = () => activerNotifs(v);
  }
}

function pousserPrefsNotifs(sub){
  const j = sub.toJSON();
  envoyer({ action:'subscribePush', endpoint:j.endpoint,
    p256dh:j.keys.p256dh, auth:j.keys.auth, qui:S.moi || '',
    matin: localStorage.getItem('notif_matin') === 'non' ? 'non' : 'oui',
    soir:  localStorage.getItem('notif_soir')  === 'non' ? 'non' : 'oui' });
}

async function activerNotifs(v){
  const etat = v.querySelector('#n_etat');
  const dire = m => { if(etat) etat.textContent = m; };
  try{
    dire('Autorisation…');
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ dire('Permission refusée.'); return; }
    const reg = await navigator.serviceWorker.ready;
    const cle = await api({action:'vapidPublic'});
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64urlToU8(cle) });
    const j = sub.toJSON();
    if(localStorage.getItem('notif_matin') === null) localStorage.setItem('notif_matin', 'oui');
    if(localStorage.getItem('notif_soir') === null) localStorage.setItem('notif_soir', 'oui');
    await majConf();
    const ok = await envoyer({ action:'subscribePush', endpoint:j.endpoint,
      p256dh:j.keys.p256dh, auth:j.keys.auth, qui:S.moi || '',
      matin: localStorage.getItem('notif_matin') === 'non' ? 'non' : 'oui',
      soir:  localStorage.getItem('notif_soir')  === 'non' ? 'non' : 'oui' });
    if(!ok){ dire('Enregistré localement — se synchronisera au retour du réseau.'); }
    localStorage.setItem('notifs','1');
    vReglages(document.getElementById('vue'));
  }catch(e){ dire('Échec : ' + e.message); }
}

/* ---------------------------------------------------------- tâches */

function vTaches(v){
  if(S.tacheEdit){ editeurTache(v); return; }
  const ts = [...S.data.taches].sort((a,b) =>
    (estActif(b)-estActif(a)) || String(a.nom).localeCompare(String(b.nom)));
  enTete('', 'Tâches', ts.filter(estActif).length + ' actives');
  v.innerHTML = '<div style="margin-top:16px"><button class="btn" id="nouvelle" style="margin:0">+ Nouvelle tâche</button></div>';
  if(!ts.length){
    v.insertAdjacentHTML('beforeend', '<p class="vide">Aucune tâche pour l\'instant.</p>');
  }else{
    const box = document.createElement('div');
    box.className = 'liste';
    box.style.marginTop = '14px';
    ts.forEach(t => {
      const el = document.createElement('div');
      el.className = 'row' + (estActif(t) ? '' : ' off');
      el.innerHTML = '<span class="txt"><span class="nom"></span><span class="meta"></span></span>' +
        (t.qui ? '<span class="pers"></span>' : '') +
        (estActif(t) ? '' : '<span class="tag">off</span>');
      el.querySelector('.nom').textContent = t.nom;
      el.querySelector('.meta').textContent =
        [t.zone, (t.duree ? t.duree+' min' : ''), recurrenceLisible(t)].filter(Boolean).join(' · ');
      if(t.qui){ const p = el.querySelector('.pers'); p.textContent = t.qui; p.style.color = couleurPersonne(t.qui); }
      el.onclick = () => { S.tacheEdit = {...t}; rendre(); };
      box.appendChild(el);
    });
    v.appendChild(box);
  }
  v.querySelector('#nouvelle').onclick = () => {
    S.tacheEdit = { id:'t'+Date.now(), nom:'', zone:'', qui:'', duree:0,
      mode:'quotidien', regle:'', actif:true, _nouveau:true };
    rendre();
  };
}

function editeurTache(v){
  const t = S.tacheEdit, gens = personnes();
  enTete('', t._nouveau ? 'Nouvelle tâche' : 'Modifier', '');
  v.innerHTML = `
  <div class="bloc">
    <div class="champ"><input type="text" class="large" id="e_nom" placeholder="Nom de la tâche"></div>
    <div class="champ"><input type="text" id="e_zone" placeholder="Zone"><input type="number" id="e_duree" placeholder="min" style="max-width:30%"></div>
    <div class="champ"><span>Pour</span><select id="e_qui"><option value="">Libre</option>${gens.map(g=>`<option>${g}</option>`).join('')}</select></div>
    <div class="champ"><span>Revient</span><select id="e_mode">
      <option value="quotidien">tous les jours</option>
      <option value="jours">certains jours</option>
      <option value="mois">un jour du mois</option>
      <option value="intervalle">tous les N jours</option>
      <option value="date">une seule fois</option></select></div>
    <div class="champ" id="e_regle_champ"><input type="text" class="large" id="e_regle"></div>
    <p class="aide" id="e_aide"></p>
    <div class="champ"><span>Active</span><span class="sw" id="e_actif"><i></i></span></div>
    <div class="err" id="e_err"></div>
    <button class="btn" id="e_save">Enregistrer</button>
    <button class="btn sec" id="e_annul">Annuler</button>
    ${t._nouveau ? '' : '<button class="btn danger" id="e_del">Supprimer la tâche</button>'}
  </div>`;

  const $ = id => v.querySelector('#'+id);
  $('e_nom').value = t.nom || '';
  $('e_zone').value = t.zone || '';
  $('e_duree').value = t.duree || '';
  $('e_qui').value = t.qui || '';
  const mode = $('e_mode'); mode.value = t.mode || 'quotidien';
  const regle = $('e_regle'), aide = $('e_aide'), actif = $('e_actif');
  actif.classList.toggle('on', estActif(t));
  actif.onclick = () => actif.classList.toggle('on');

  const majAide = garder => {
    const m = mode.value;
    $('e_regle_champ').hidden = (m === 'quotidien');
    if(m === 'quotidien'){
      aide.textContent = 'La tâche revient chaque jour.';
    } else if(m === 'date'){
      regle.type = 'date';
      aide.textContent = 'Le jour où la tâche doit être faite une fois.';
    } else {
      regle.type = 'text';
      regle.placeholder = m==='jours' ? 'lun,jeu' : m==='mois' ? '1' : '14';
      aide.textContent = m==='jours' ? 'Codes : lun, mar, mer, jeu, ven, sam, dim.'
        : m==='mois' ? 'Le jour du mois, entre 1 et 31.' : 'Nombre de jours entre deux fois.';
    }
    if(!garder) regle.value = '';
  };
  regle.value = t.regle || '';
  majAide(true);
  mode.onchange = () => majAide(false);

  $('e_annul').onclick = () => { S.tacheEdit = null; rendre(); };

  if(!t._nouveau) $('e_del').onclick = async () => {
    if(!confirm('Supprimer « ' + t.nom + ' » ? Les tâches déjà cochées restent dans l\'historique.')) return;
    S.data.taches = S.data.taches.filter(x => String(x.id) !== String(t.id));
    localStorage.setItem('cache', JSON.stringify(S.data));
    S.tacheEdit = null; rendre();
    if(await envoyer({action:'deleteTache', id:t.id})) charger();
  };

  $('e_save').onclick = async () => {
    const err = $('e_err');
    const nom = $('e_nom').value.trim();
    const m = mode.value;
    const r = m === 'quotidien' ? '' : regle.value.trim();
    if(!nom){ err.textContent = 'Donnez un nom à la tâche.'; return; }
    if(m !== 'quotidien' && !r){ err.textContent = 'Renseignez la récurrence.'; return; }
    if(m==='jours' && !r.split(',').every(x=>JOURS.includes(x.trim()))){
      err.textContent = 'Jours invalides. Exemple : lun,jeu'; return; }
    if((m==='mois' || m==='intervalle') && !/^\d+$/.test(r)){
      err.textContent = 'Attendu : un nombre.'; return; }
    if(m==='mois' && (+r < 1 || +r > 31)){ err.textContent = 'Jour du mois entre 1 et 31.'; return; }
    if(m==='date' && !/^\d{4}-\d{2}-\d{2}$/.test(r)){ err.textContent = 'Choisissez une date.'; return; }
    err.textContent = '';
    const nt = { id:t.id, nom, zone:$('e_zone').value.trim(), qui:$('e_qui').value,
      duree:+$('e_duree').value || 0, mode:m, regle:r, actif:actif.classList.contains('on') };
    const i = S.data.taches.findIndex(x => String(x.id) === String(nt.id));
    if(i >= 0) S.data.taches[i] = nt; else S.data.taches.push(nt);
    localStorage.setItem('cache', JSON.stringify(S.data));
    S.tacheEdit = null; rendre();
    if(await envoyer({action:'saveTache', tache:JSON.stringify(nt)})) charger();
  };

  ['e_nom','e_zone','e_regle'].forEach(id => $(id).oninput = () => $('e_err').textContent = '');
}

function sw(cle, label, c){
  const on = String(c[cle]||'').toLowerCase()==='oui';
  return `<div class="champ"><span>${label}</span><span class="sw${on?' on':''}" data-k="${cle}"><i></i></span></div>`;
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => aller(b.dataset.v));

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    majConf();
    reg.addEventListener('updatefound', () => {
      const nv = reg.installing;
      if(!nv) return;
      nv.addEventListener('statechange', () => {
        if(nv.state === 'installed' && navigator.serviceWorker.controller){
          const m = document.getElementById('maj');
          m.hidden = false;
          m.textContent = 'Nouvelle version — appuyer pour recharger';
          m.onclick = () => reg.waiting && reg.waiting.postMessage({type:'SKIP_WAITING'});
        }
      });
    });
  });
  let recharge = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(recharge) return;
    recharge = true;
    location.reload();
  });
}
appliquerTheme(S.theme);
try{
  const snz = JSON.parse(localStorage.getItem('snooze') || '{}');
  const auj = ymd(new Date());
  let chg = false;
  for(const k in snz) if(snz[k] < auj){ delete snz[k]; chg = true; }
  if(chg) localStorage.setItem('snooze', JSON.stringify(snz));
}catch(e){}
if(S.data) rendre();
S.api ? charger() : (S.vue = 'reglages', rendre());
</script>
