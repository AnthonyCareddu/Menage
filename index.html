<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ménage</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eef1ef" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#12161a" media="(prefers-color-scheme:dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#eef1ef; --card:#fff; --ink:#14181b; --muted:#6b7573;
  --line:#dde2df; --accent:#2f6b4f; --late:#b8730f; --late-bg:#f8efdf;
  --pers-bg:#e7ece9; --hors:#b3bbb6; --err:#a3352d;
}
@media(prefers-color-scheme:dark){
  :root{
    --page:#12161a; --card:#1b2126; --ink:#e7ece9; --muted:#8a938f;
    --line:#2b333a; --accent:#5aa980; --late:#d98a2b; --late-bg:#33291a;
    --pers-bg:#243029; --hors:#4b555c; --err:#e0776e;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}

header{padding:22px 20px 14px;background:var(--page);position:sticky;top:0;z-index:5}
.jour{font-size:13px;color:var(--muted)}
.compte{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.gros{font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1}
.gros-sub{font-size:14px;color:var(--muted)}

main{padding:0 0 92px}
.groupe{font-size:12px;color:var(--muted);padding:16px 20px 6px}
.row{display:flex;align-items:center;gap:14px;padding:14px 20px;
  background:var(--card);border-top:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:1px solid var(--line)}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s}
.box svg{width:14px;height:14px;stroke:#fff;stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .18s}
.row.ok .box{background:var(--accent);border-color:var(--accent)}
.row.ok .box svg{opacity:1}
.txt{flex:1;min-width:0}
.nom{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.ok .nom{text-decoration:line-through;color:var(--muted)}
.meta{display:block;font-size:12.5px;color:var(--muted)}
.tag{flex:none;font-size:11.5px;padding:3px 8px;border-radius:11px;background:var(--late-bg);color:var(--late)}
.pers{flex:none;font-size:11.5px;padding:3px 8px;border-radius:11px;background:var(--pers-bg);color:var(--accent)}

.vide{padding:48px 20px;text-align:center;color:var(--muted)}

.semaine{padding:8px 0}
.jt{font-size:13px;font-weight:600;padding:18px 20px 2px}
.jt span{font-weight:400;color:var(--muted)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:12px 14px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cell{aspect-ratio:1;background:var(--card);border-radius:8px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px}
.cell.hors{background:transparent;color:var(--hors)}
.cell.today{outline:1.5px solid var(--accent)}
.pt{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.pts{display:flex;gap:2px;height:5px}

nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:11px 0 13px;font-size:11px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:600}

.pilule{border:1px solid var(--line);background:none;color:var(--muted);
  border-radius:14px;padding:5px 12px;font-size:13px}
.pilule.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.barre{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:4px 0 14px;background:var(--line)}
.barre span{display:block}
.puce{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}

.bloc{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:16px 20px;margin-top:18px}
.champ{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0}
.champ input[type=text],.champ input[type=number],.champ input[type=date],.champ select{
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--page);max-width:56%}
.champ input.large{max-width:100%;width:100%}
.row.off{opacity:.55}
h2{font-size:15px;font-weight:600;margin:0 0 6px}
.aide{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:9px;padding:10px 16px;width:100%;margin-top:12px}
.btn.sec{background:none;color:var(--accent)}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line);flex:none}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .18s}
.sw.on i{transform:translateX(18px)}
.bandeau{background:var(--late-bg);color:var(--late);font-size:13px;padding:9px 20px;text-align:center}
.err{color:var(--err);font-size:13px;padding:6px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="bandeau" class="bandeau" hidden></div>
<div id="maj" class="bandeau" hidden style="cursor:pointer"></div>
<header>
  <div class="jour" id="dateLabel"></div>
  <div class="compte"><span class="gros" id="gros">—</span><span class="gros-sub" id="grosSub"></span></div>
</header>

<main id="vue"></main>

<nav>
  <button data-v="jour" class="on">Aujourd'hui</button>
  <button data-v="semaine">Semaine</button>
  <button data-v="mois">Mois</button>
  <button data-v="bilan">Bilan</button>
  <button data-v="reglages">Réglages</button>
</nav>

<script>
const JOURS = ['dim','lun','mar','mer','jeu','ven','sam'];
const JOURS_L = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

const S = {
  api: localStorage.getItem('api') || '',
  moi: localStorage.getItem('moi') || '',
  data: JSON.parse(localStorage.getItem('cache') || 'null'),
  vue: 'jour',
  ancre: new Date(),
  tacheEdit: null,
  bilanPeriode: 7
};

const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseYmd = s => { const p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const plus = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(params){
  if(!S.api) throw new Error('Adresse du serveur non renseignée');
  const u = new URL(S.api);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k,v));
  let r;
  try{ r = await fetch(u.toString()); }
  catch(e){ const err = new Error('réseau indisponible'); err.reseau = true; throw err; }
  const j = await r.json();
  if(!j.ok) throw new Error(j.erreur || 'erreur serveur');
  return j.data;
}

async function charger(){
  try{
    S.data = await api({action:'data'});
    localStorage.setItem('cache', JSON.stringify(S.data));
    S.horsLigne = false;
    viderFile();
  }catch(e){
    S.horsLigne = true;
  }
  statut();
  rendre();
}

/* ------------------------------------------- file d'attente hors-ligne */

S.queue = JSON.parse(localStorage.getItem('queue') || '[]');
S.horsLigne = false;

function sauverFile(){ localStorage.setItem('queue', JSON.stringify(S.queue)); }

async function envoyer(params){
  try{
    await api(params);
    S.horsLigne = false;
    await viderFile();
    return true;
  }catch(e){
    if(e.reseau){
      S.queue.push({ params, ts: Date.now() });
      sauverFile();
      statut();
    }else{
      bandeau('Refusé par le serveur : ' + e.message);
    }
    return false;
  }
}

async function viderFile(){
  while(S.queue.length){
    try{
      await api(S.queue[0].params);
    }catch(e){
      if(e.reseau){ statut(); return; }
      S.queue.shift(); sauverFile();   // erreur serveur : on abandonne l'item pour ne pas bloquer
      continue;
    }
    S.queue.shift(); sauverFile();
  }
  statut();
}

function statut(){
  const n = S.queue.length;
  if(n) bandeau(n + (n > 1 ? ' modifs' : ' modif') + ' en attente — synchro au retour du réseau');
  else if(S.horsLigne) bandeau(S.data ? 'Hors ligne — dernières données connues' : 'Impossible de joindre le serveur');
  else bandeau(null);
}

addEventListener('online', viderFile);
addEventListener('visibilitychange', () => { if(!document.hidden) viderFile(); });

function bandeau(msg){
  const b = document.getElementById('bandeau');
  b.hidden = !msg; b.textContent = msg || '';
}

/* ---------------------------------------------- moteur de récurrence */

function derniereFois(id){
  let d = null;
  (S.data.journal||[]).forEach(r => { if(r.id===id && (!d || r.date>d)) d = r.date; });
  return d;
}

function estDue(t, dateStr){
  const d = parseYmd(dateStr);
  if(t.mode === 'jours')
    return String(t.regle).split(',').map(s=>s.trim()).includes(JOURS[d.getDay()]);
  if(t.mode === 'mois'){
    const dernier = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    return d.getDate() === Math.min(parseInt(t.regle,10), dernier);
  }
  if(t.mode === 'intervalle'){
    const n = parseInt(t.regle,10) || 1;
    const last = derniereFois(t.id);
    if(!last) return true;
    return Math.round((d - parseYmd(last)) / 86400000) >= n;
  }
  if(t.mode === 'date')
    return dateStr === String(t.regle);
  return false;
}

function retard(t, dateStr){
  if(t.mode === 'date'){
    if(derniereFois(t.id)) return 0;
    return Math.max(0, Math.round((parseYmd(dateStr) - parseYmd(String(t.regle)))/86400000));
  }
  if(t.mode !== 'intervalle') return 0;
  const n = parseInt(t.regle,10) || 1;
  const last = derniereFois(t.id);
  if(!last) return 0;
  return Math.max(0, Math.round((parseYmd(dateStr) - parseYmd(last))/86400000) - n);
}

const faite = (id, dateStr) => (S.data.journal||[]).some(r => r.id===id && r.date===dateStr);

function estActif(t){
  if(t.actif === false) return false;
  const s = String(t.actif).toLowerCase();
  return s !== 'false' && s !== 'faux' && s !== 'non';
}

function recurrenceLisible(t){
  if(t.mode === 'jours') return String(t.regle);
  if(t.mode === 'mois') return 'le ' + t.regle + ' du mois';
  if(t.mode === 'intervalle') return 'tous les ' + t.regle + ' j';
  if(t.mode === 'date') return 'le ' + t.regle;
  return '';
}

function personnes(){
  const c = (S.data && S.data.config) || {};
  return (c.personnes || 'Antho,Alexandra').split(',').map(s=>s.trim()).filter(Boolean);
}

function pourLeJour(dateStr){
  if(!S.data) return [];
  const auj = dateStr === ymd(new Date());
  return S.data.taches
    .filter(estActif)
    .filter(t => estDue(t, dateStr) ||
      (auj && t.mode === 'date' && String(t.regle) < dateStr && !derniereFois(t.id)))
    .map(t => ({...t, retard: retard(t,dateStr), faite: faite(t.id,dateStr)}))
    .sort((a,b) => (b.retard-a.retard) || (a.faite-b.faite) || a.nom.localeCompare(b.nom));
}

/* ------------------------------------------------------------- rendu */

function rendre(){
  const v = document.getElementById('vue');
  const navActif = S.vue === 'taches' ? 'reglages' : S.vue;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v===navActif));
  if(!S.data && S.vue !== 'reglages'){ enTete('','Configuration requise'); v.innerHTML =
    '<p class="vide">Renseignez l\'adresse du serveur dans Réglages pour démarrer.</p>'; return; }
  ({jour:vJour, semaine:vSemaine, mois:vMois, bilan:vBilan, reglages:vReglages, taches:vTaches})[S.vue](v);
}

function enTete(label, gros, sub){
  document.getElementById('dateLabel').textContent = label;
  document.getElementById('gros').textContent = gros;
  document.getElementById('grosSub').textContent = sub || '';
}

function ligne(t, dateStr){
  const el = document.createElement('div');
  el.className = 'row' + (t.faite ? ' ok' : '');
  el.innerHTML =
    '<span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>' +
    '<span class="txt"><span class="nom"></span><span class="meta"></span></span>' +
    (t.retard>0 ? '<span class="tag">+'+t.retard+' j</span>' : '') +
    (t.qui ? '<span class="pers"></span>' : '');
  el.querySelector('.nom').textContent = t.nom;
  const bouts = [t.zone, t.duree+' min'];
  if(t.mode === 'intervalle'){
    const last = derniereFois(t.id);
    if(last) bouts.push('il y a ' + Math.round((parseYmd(dateStr) - parseYmd(last))/86400000) + ' j');
  }
  el.querySelector('.meta').textContent = bouts.filter(Boolean).join(' · ');
  if(t.qui) el.querySelector('.pers').textContent = t.qui;
  el.onclick = () => cocher(t, dateStr, el);
  return el;
}

async function cocher(t, dateStr, el){
  const on = !el.classList.contains('ok');
  el.classList.toggle('ok', on);
  if(on && navigator.vibrate) navigator.vibrate(15);
  const qui = t.qui || S.moi || '';
  if(on) S.data.journal.push({id:t.id, date:dateStr, qui, retard:0});
  else S.data.journal = S.data.journal.filter(r => !(r.id===t.id && r.date===dateStr));
  localStorage.setItem('cache', JSON.stringify(S.data));
  if(S.vue==='jour') majCompteur();
  envoyer({action:'toggle', id:t.id, date:dateStr, qui});
}

function majCompteur(){
  const d = ymd(new Date());
  const l = pourLeJour(d), reste = l.filter(t=>!t.faite);
  const min = reste.reduce((s,t)=>s+(Number(t.duree)||0),0);
  const dd = new Date();
  enTete(JOURS_L[dd.getDay()] + ' ' + dd.getDate() + ' ' + MOIS_L[dd.getMonth()],
    reste.length ? min + ' min' : 'Terminé',
    reste.length ? reste.length + ' tâches restantes' : l.length + ' tâches faites');
}

function vJour(v){
  const d = ymd(new Date());
  majCompteur();
  const l = pourLeJour(d);
  v.innerHTML = '';
  if(!l.length){ v.innerHTML = '<p class="vide">Rien de prévu aujourd\'hui.</p>'; return; }
  const tard = l.filter(t=>t.retard>0), reste = l.filter(t=>t.retard===0);
  if(tard.length){ v.appendChild(titre('En retard')); tard.forEach(t=>v.appendChild(ligne(t,d))); }
  if(reste.length){ v.appendChild(titre(tard.length ? 'Aujourd\'hui' : '')); reste.forEach(t=>v.appendChild(ligne(t,d))); }
}

function titre(txt){
  const e = document.createElement('div');
  e.className = 'groupe'; e.textContent = txt;
  return e;
}

function vSemaine(v){
  const base = new Date();
  const lundi = plus(base, -((base.getDay()+6)%7));
  let total = 0;
  v.innerHTML = '<div class="semaine"></div>';
  const w = v.firstChild;
  for(let i=0;i<7;i++){
    const d = plus(lundi,i), ds = ymd(d), l = pourLeJour(ds);
    total += l.filter(t=>!t.faite).reduce((s,t)=>s+(Number(t.duree)||0),0);
    const h = document.createElement('div');
    h.className = 'jt';
    h.innerHTML = JOURS_L[d.getDay()] + ' ' + d.getDate() + ' <span>' + (l.length ? l.length + ' tâches' : 'rien') + '</span>';
    w.appendChild(h);
    l.forEach(t => w.appendChild(ligne(t, ds)));
  }
  enTete('semaine du ' + lundi.getDate() + ' ' + MOIS_L[lundi.getMonth()], total + ' min', 'restantes sur la semaine');
}

function vMois(v){
  const a = S.ancre, an = a.getFullYear(), mo = a.getMonth();
  const premier = new Date(an, mo, 1);
  const debut = plus(premier, -((premier.getDay()+6)%7));
  const today = ymd(new Date());
  let html = '<div class="cal">' + ['lun','mar','mer','jeu','ven','sam','dim'].map(j=>'<div class="dow">'+j+'</div>').join('');
  for(let i=0;i<42;i++){
    const d = plus(debut,i), ds = ymd(d), hors = d.getMonth() !== mo;
    const n = hors ? 0 : pourLeJour(ds).length;
    const pts = '<div class="pts">' + Array.from({length:Math.min(n,4)}, ()=>'<span class="pt"></span>').join('') + '</div>';
    html += '<div class="cell' + (hors?' hors':'') + (ds===today?' today':'') + '">' + d.getDate() + (n?pts:'') + '</div>';
  }
  html += '</div><div style="padding:0 20px"><button class="btn sec" id="prev">Mois précédent</button>' +
    '<button class="btn sec" id="next">Mois suivant</button></div>' +
    '<p class="aide" style="padding:0 20px">Les tâches à intervalle sont projetées à titre indicatif : leur vraie date dépend du moment où vous les cochez.</p>';
  v.innerHTML = html;
  v.querySelector('#prev').onclick = () => { S.ancre = new Date(an, mo-1, 1); rendre(); };
  v.querySelector('#next').onclick = () => { S.ancre = new Date(an, mo+1, 1); rendre(); };
  enTete(MOIS_L[mo] + ' ' + an, MOIS_L[mo], '');
}

/* ---------------------------------------------------------- bilan */

function statsPeriode(jours){
  const fin = new Date(); fin.setHours(23,59,59,999);
  const debut = plus(new Date(), -(jours-1)); debut.setHours(0,0,0,0);
  const actives = S.data.taches.filter(estActif);
  const dureeParId = {};
  S.data.taches.forEach(t => dureeParId[t.id] = Number(t.duree) || 0);

  const faits = (S.data.journal||[]).filter(r => {
    const d = parseYmd(r.date);
    return d >= debut && d <= fin;
  });

  const parPersonne = {};
  let aLheure = 0;
  faits.forEach(r => {
    const q = r.qui || 'non attribué';
    parPersonne[q] = parPersonne[q] || {n:0, min:0};
    parPersonne[q].n++;
    parPersonne[q].min += dureeParId[r.id] || 0;
    if((Number(r.retard)||0) <= 0) aLheure++;
  });

  let attendu = 0;
  actives.forEach(t => {
    if(t.mode === 'jours') attendu += String(t.regle).split(',').length * (jours/7);
    else if(t.mode === 'mois') attendu += jours/30;
    else if(t.mode === 'intervalle') attendu += jours / (parseInt(t.regle,10) || 1);
    else if(t.mode === 'date'){
      const jd = parseYmd(String(t.regle));
      if(jd >= debut && jd <= fin) attendu += 1;
    }
  });
  attendu = Math.max(1, Math.round(attendu));

  const vues = {};
  faits.forEach(r => vues[r.id] = 1);
  return {
    faits, parPersonne, attendu,
    oubliees: actives.filter(t => !vues[t.id]),
    ponctualite: faits.length ? Math.round(aLheure/faits.length*100) : 0,
    accomplissement: Math.min(100, Math.round(faits.length/attendu*100))
  };
}

function vBilan(v){
  const jours = S.bilanPeriode;
  const st = statsPeriode(jours);
  enTete('', 'Bilan', jours + ' derniers jours');

  personnes().forEach(g => { if(!st.parPersonne[g]) st.parPersonne[g] = {n:0, min:0}; });
  const noms = Object.keys(st.parPersonne)
    .sort((a,b) => st.parPersonne[b].min - st.parPersonne[a].min || st.parPersonne[b].n - st.parPersonne[a].n);
  const COUL = ['var(--accent)', '#7b9cc4', '#c48a6a', '#9a7bc4'];
  const totalMin = noms.reduce((s,q) => s + st.parPersonne[q].min, 0);
  const totalN = noms.reduce((s,q) => s + st.parPersonne[q].n, 0);
  const base = totalMin > 0 ? 'min' : 'n';
  const total = base === 'min' ? totalMin : totalN;

  const segments = total
    ? noms.map((q,i) => `<span style="width:${st.parPersonne[q][base]/total*100}%;background:${COUL[i%4]}"></span>`).join('')
    : '';

  v.innerHTML = `
  <div class="bloc">
    <div class="champ" style="justify-content:flex-start;gap:8px;padding:0 0 4px">
      <button class="pilule${jours===7?' on':''}" data-j="7">7 jours</button>
      <button class="pilule${jours===30?' on':''}" data-j="30">30 jours</button>
    </div>
    <h2>Répartition</h2>
    <p class="aide">Part de chacun${base==='min'?', en temps passé':', en nombre de tâches'}.</p>
    <div class="barre">${segments}</div>
    ${noms.map((q,i) => `<div class="champ" style="padding:6px 0">
      <span><span class="puce" style="background:${COUL[i%4]}"></span>${esc(q)}</span>
      <span class="aide" style="margin:0">${st.parPersonne[q].n} tâches · ${st.parPersonne[q].min} min${total?' · '+Math.round(st.parPersonne[q][base]/total*100)+'%':''}</span>
    </div>`).join('')}
    ${totalN ? '' : '<p class="aide">Rien de coché sur la période.</p>'}
  </div>
  <div class="bloc">
    <h2>Sur la période</h2>
    <div class="champ" style="padding:6px 0"><span>Tâches faites</span><span>${st.faits.length} <span class="aide" style="margin:0">/ ~${st.attendu} prévues</span></span></div>
    <div class="champ" style="padding:6px 0"><span>Accomplissement</span><span>${st.accomplissement} %</span></div>
    <div class="champ" style="padding:6px 0"><span>Dans les temps</span><span>${st.ponctualite} %</span></div>
  </div>
  <div class="bloc">
    <h2>Jamais faites sur la période</h2>
    ${st.oubliees.length
      ? st.oubliees.map(t => `<div class="champ" style="padding:6px 0"><span>${esc(t.nom)}</span><span class="aide" style="margin:0">${esc(recurrenceLisible(t))}</span></div>`).join('')
      : '<p class="aide">Rien — tout est passé au moins une fois.</p>'}
  </div>`;

  v.querySelectorAll('.pilule').forEach(b => b.onclick = () => { S.bilanPeriode = +b.dataset.j; rendre(); });
}

/* -------------------------------------------------------- réglages */

function vReglages(v){
  enTete('', 'Réglages', '');
  const c = (S.data && S.data.config) || {};
  const gens = personnes();
  v.innerHTML = `
  <div class="bloc">
    <h2>Serveur</h2>
    <p class="aide">L'adresse en /exec donnée par Apps Script au déploiement.</p>
    <div class="champ"><input type="text" class="large" id="api" placeholder="https://script.google.com/…/exec"></div>
    <button class="btn" id="saveApi">Enregistrer et charger</button>
  </div>
  <div class="bloc">
    <h2>Je suis</h2>
    <p class="aide">Utilisé pour créditer les tâches libres que vous cochez.</p>
    <div class="champ"><select id="moi">${gens.map(g=>`<option${g===S.moi?' selected':''}>${g}</option>`).join('')}</select></div>
  </div>
  <div class="bloc">
    <h2>Tâches</h2>
    <p class="aide">Ajouter, modifier, désactiver ou supprimer une tâche.</p>
    <button class="btn sec" id="gererTaches">Gérer les tâches →</button>
  </div>
  <div class="bloc">
    <h2>Envois automatiques</h2>
    ${sw('mail_quotidien','Mail quotidien',c)}
    ${sw('mail_hebdo','Récap hebdomadaire',c)}
    ${sw('mail_mensuel','Récap mensuel',c)}
    ${sw('vacances','Mode vacances',c)}
    <p class="aide">Le mode vacances suspend tous les envois sans rien effacer.</p>
  </div>`;

  const api_ = v.querySelector('#api'); api_.value = S.api;
  v.querySelector('#saveApi').onclick = () => {
    S.api = api_.value.trim(); localStorage.setItem('api', S.api); charger();
  };
  v.querySelector('#moi').onchange = e => { S.moi = e.target.value; localStorage.setItem('moi', S.moi); };
  v.querySelector('#gererTaches').onclick = () => { S.tacheEdit = null; S.vue = 'taches'; rendre(); };
  v.querySelectorAll('.sw').forEach(el => el.onclick = () => {
    const on = !el.classList.contains('on');
    el.classList.toggle('on', on);
    if(S.data) S.data.config[el.dataset.k] = on ? 'oui' : 'non';
    localStorage.setItem('cache', JSON.stringify(S.data));
    envoyer({action:'setConfig', cle:el.dataset.k, valeur:on?'oui':'non'});
  });
}

/* ---------------------------------------------------------- tâches */

function vTaches(v){
  if(S.tacheEdit){ editeurTache(v); return; }
  const ts = [...S.data.taches].sort((a,b) =>
    (estActif(b)-estActif(a)) || String(a.nom).localeCompare(String(b.nom)));
  enTete('', 'Tâches', ts.filter(estActif).length + ' actives');
  v.innerHTML = '<div style="padding:14px 20px 4px"><button class="btn" id="nouvelle">+ Nouvelle tâche</button></div>';
  if(!ts.length) v.insertAdjacentHTML('beforeend', '<p class="vide">Aucune tâche pour l\'instant.</p>');
  ts.forEach(t => {
    const el = document.createElement('div');
    el.className = 'row' + (estActif(t) ? '' : ' off');
    el.innerHTML = '<span class="txt"><span class="nom"></span><span class="meta"></span></span>' +
      (t.qui ? '<span class="pers"></span>' : '') +
      (estActif(t) ? '' : '<span class="tag">off</span>');
    el.querySelector('.nom').textContent = t.nom;
    el.querySelector('.meta').textContent =
      [t.zone, (t.duree ? t.duree+' min' : ''), recurrenceLisible(t)].filter(Boolean).join(' · ');
    if(t.qui) el.querySelector('.pers').textContent = t.qui;
    el.onclick = () => { S.tacheEdit = {...t}; rendre(); };
    v.appendChild(el);
  });
  const retour = document.createElement('button');
  retour.className = 'btn sec';
  retour.textContent = '‹ Retour aux réglages';
  retour.style.cssText = 'width:calc(100% - 40px);margin:18px 20px';
  retour.onclick = () => { S.vue = 'reglages'; rendre(); };
  v.appendChild(retour);
  v.querySelector('#nouvelle').onclick = () => {
    S.tacheEdit = { id:'t'+Date.now(), nom:'', zone:'', qui:'', duree:0,
      mode:'jours', regle:'', actif:true, _nouveau:true };
    rendre();
  };
}

function editeurTache(v){
  const t = S.tacheEdit, gens = personnes();
  enTete('', t._nouveau ? 'Nouvelle tâche' : 'Modifier', '');
  v.innerHTML = `
  <div class="bloc">
    <div class="champ"><input type="text" class="large" id="e_nom" placeholder="Nom de la tâche"></div>
    <div class="champ"><input type="text" id="e_zone" placeholder="Zone"><input type="number" id="e_duree" placeholder="min" style="max-width:30%"></div>
    <div class="champ"><span>Pour</span><select id="e_qui"><option value="">Libre</option>${gens.map(g=>`<option>${g}</option>`).join('')}</select></div>
    <div class="champ"><span>Revient</span><select id="e_mode">
      <option value="jours">certains jours</option>
      <option value="mois">un jour du mois</option>
      <option value="intervalle">tous les N jours</option>
      <option value="date">une seule fois</option></select></div>
    <div class="champ"><input type="text" class="large" id="e_regle"></div>
    <p class="aide" id="e_aide"></p>
    <div class="champ"><span>Active</span><span class="sw" id="e_actif"><i></i></span></div>
    <div class="err" id="e_err"></div>
    <button class="btn" id="e_save">Enregistrer</button>
    ${t._nouveau ? '' : '<button class="btn sec" id="e_del">Supprimer la tâche</button>'}
    <button class="btn sec" id="e_annul">Annuler</button>
  </div>`;

  const $ = id => v.querySelector('#'+id);
  $('e_nom').value = t.nom || '';
  $('e_zone').value = t.zone || '';
  $('e_duree').value = t.duree || '';
  $('e_qui').value = t.qui || '';
  const mode = $('e_mode'); mode.value = t.mode || 'jours';
  const regle = $('e_regle'), aide = $('e_aide'), actif = $('e_actif');
  actif.classList.toggle('on', estActif(t));
  actif.onclick = () => actif.classList.toggle('on');

  const majAide = garder => {
    const m = mode.value;
    if(m === 'date'){
      regle.type = 'date';
      aide.textContent = 'Le jour où la tâche doit être faite une fois.';
    } else {
      regle.type = 'text';
      regle.placeholder = m==='jours' ? 'lun,jeu' : m==='mois' ? '1' : '14';
      aide.textContent = m==='jours' ? 'Codes : lun, mar, mer, jeu, ven, sam, dim.'
        : m==='mois' ? 'Le jour du mois, entre 1 et 31.' : 'Nombre de jours entre deux fois.';
    }
    if(!garder) regle.value = '';
  };
  regle.value = t.regle || '';
  majAide(true);
  mode.onchange = () => majAide(false);

  $('e_annul').onclick = () => { S.tacheEdit = null; rendre(); };

  if(!t._nouveau) $('e_del').onclick = async () => {
    if(!confirm('Supprimer « ' + t.nom + ' » ? Les tâches déjà cochées restent dans l\'historique.')) return;
    S.data.taches = S.data.taches.filter(x => String(x.id) !== String(t.id));
    localStorage.setItem('cache', JSON.stringify(S.data));
    S.tacheEdit = null; rendre();
    if(await envoyer({action:'deleteTache', id:t.id})) charger();
  };

  $('e_save').onclick = async () => {
    const err = $('e_err');
    const nom = $('e_nom').value.trim();
    const m = mode.value;
    const r = regle.value.trim();
    if(!nom){ err.textContent = 'Donnez un nom à la tâche.'; return; }
    if(!r){ err.textContent = 'Renseignez la récurrence.'; return; }
    if(m==='jours' && !r.split(',').every(x=>JOURS.includes(x.trim()))){
      err.textContent = 'Jours invalides. Exemple : lun,jeu'; return; }
    if((m==='mois' || m==='intervalle') && !/^\d+$/.test(r)){
      err.textContent = 'Attendu : un nombre.'; return; }
    if(m==='mois' && (+r < 1 || +r > 31)){ err.textContent = 'Jour du mois entre 1 et 31.'; return; }
    if(m==='date' && !/^\d{4}-\d{2}-\d{2}$/.test(r)){ err.textContent = 'Choisissez une date.'; return; }
    err.textContent = '';
    const nt = { id:t.id, nom, zone:$('e_zone').value.trim(), qui:$('e_qui').value,
      duree:+$('e_duree').value || 0, mode:m, regle:r, actif:actif.classList.contains('on') };
    const i = S.data.taches.findIndex(x => String(x.id) === String(nt.id));
    if(i >= 0) S.data.taches[i] = nt; else S.data.taches.push(nt);
    localStorage.setItem('cache', JSON.stringify(S.data));
    S.tacheEdit = null; rendre();
    if(await envoyer({action:'saveTache', tache:JSON.stringify(nt)})) charger();
  };

  ['e_nom','e_zone','e_regle'].forEach(id => $(id).oninput = () => $('e_err').textContent = '');
}

function sw(cle, label, c){
  const on = String(c[cle]||'').toLowerCase()==='oui';
  return `<div class="champ"><span>${label}</span><span class="sw${on?' on':''}" data-k="${cle}"><i></i></span></div>`;
}

document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => { S.vue = b.dataset.v; S.ancre = new Date(); rendre(); });

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nv = reg.installing;
      if(!nv) return;
      nv.addEventListener('statechange', () => {
        if(nv.state === 'installed' && navigator.serviceWorker.controller){
          const m = document.getElementById('maj');
          m.hidden = false;
          m.textContent = 'Nouvelle version — appuyer pour recharger';
          m.onclick = () => reg.waiting && reg.waiting.postMessage({type:'SKIP_WAITING'});
        }
      });
    });
  });
  let recharge = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(recharge) return;
    recharge = true;
    location.reload();
  });
}
S.api ? charger() : (S.vue='reglages', rendre());
</script>
</body>
</html>
